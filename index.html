<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>성경 66권 5개 언어 듣기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&family=Noto+Sans+Hebrew:wght@500;700&family=Noto+Sans+SC:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fbf6ec; --paper:#fffdf8; --ink:#3b2f2a; --muted:#8a7a6e; --line:#ecdfcc;
  --ko:#e8604c; --en:#3d8fd6; --es:#f2a325; --he:#4aa86b; --zh:#9b5fc9;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Gowun Dodum",system-ui,sans-serif;
  background-image:radial-gradient(circle at 12% 18%,#f6e7cf 0 2px,transparent 3px),radial-gradient(circle at 70% 60%,#f3e3c8 0 2px,transparent 3px);
  background-size:46px 46px,58px 58px;}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.app{max-width:880px;margin:0 auto;padding:14px 16px 28px;min-height:100%;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand{font-family:Jua,sans-serif;font-size:22px;margin-right:auto;display:flex;align-items:center;gap:8px}
.brand svg{flex:none}
.chip{background:var(--paper);border:2px solid var(--line);border-radius:999px;padding:8px 14px;font-size:15px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.chip:hover{border-color:#d9c6a8}
.chip.ok{border-color:#9fd3ae;background:#f1faf3}
.card{margin-top:14px;background:var(--paper);border:2px solid var(--line);border-radius:28px;padding:22px 22px 24px;box-shadow:0 10px 0 -4px #efe1c9;flex:1;display:flex;flex-direction:column;touch-action:pan-y}
.top{display:flex;align-items:center;gap:14px}
.num{font-family:Jua,sans-serif;font-size:26px;width:64px;height:64px;border-radius:20px;background:#fde3c8;display:grid;place-items:center;flex:none}
.title{font-family:Jua,sans-serif;font-size:clamp(34px,7vw,54px);line-height:1.05}
.testament{font-size:14px;color:var(--muted);margin-top:4px}
.grid{display:grid;grid-template-columns:1fr;gap:12px;margin-top:20px}
@media(min-width:640px){.grid{grid-template-columns:1fr 1fr}.grid .lang:first-child{grid-column:1/-1}}
.lang{--c:var(--ko);position:relative;display:flex;align-items:center;gap:14px;text-align:left;padding:14px 16px;border-radius:22px;background:color-mix(in srgb,var(--c) 10%,white);border:3px solid color-mix(in srgb,var(--c) 35%,white);transition:transform .12s,box-shadow .12s;min-height:86px}
.lang:hover{transform:translateY(-2px);box-shadow:0 6px 0 -1px color-mix(in srgb,var(--c) 30%,white)}
.lang:active{transform:translateY(1px)}
.lang .play{width:52px;height:52px;border-radius:50%;background:var(--c);display:grid;place-items:center;flex:none;color:#fff}
.lang .lbl{font-size:13px;color:color-mix(in srgb,var(--c) 75%,black);font-weight:700;letter-spacing:.02em;display:flex;gap:6px;align-items:center}
.lang .word{font-size:clamp(22px,4.4vw,30px);font-family:Jua,"Noto Sans SC","Noto Sans Hebrew",sans-serif;line-height:1.2;word-break:keep-all}
.lang .pr{font-size:14px;color:var(--muted);margin-top:2px}
.lang .body{min-width:0;flex:1}
.lang[data-l=he] .word{font-family:"Noto Sans Hebrew",sans-serif;font-weight:700}
.lang[data-l=zh] .word{font-family:"Noto Sans SC",sans-serif;font-weight:700}
.tag{font-size:11px;font-weight:400;padding:1px 7px;border-radius:999px;background:#fff;border:1px solid var(--line);color:var(--muted)}
.lang.playing{box-shadow:0 0 0 5px color-mix(in srgb,var(--c) 30%,transparent)}
.lang.playing .play{animation:pulse .8s ease-in-out infinite alternate}
@keyframes pulse{to{transform:scale(1.1)}}
.lang.missing{opacity:.55}
.bar{display:flex;align-items:center;gap:10px;margin-top:18px}
.nav{width:62px;height:62px;border-radius:50%;background:#fff;border:3px solid var(--line);display:grid;place-items:center;flex:none}
.nav:hover{border-color:#d9c6a8}.nav:disabled{opacity:.35;cursor:default}
.all{flex:1;height:62px;border-radius:999px;background:var(--ink);color:#fff;font-family:Jua,sans-serif;font-size:22px;display:flex;align-items:center;justify-content:center;gap:10px}
.all.on{background:#c0392b}
.dots{display:flex;justify-content:center;gap:3px;margin-top:14px;flex-wrap:wrap}
.dots i{width:7px;height:7px;border-radius:50%;background:#e4d3b8}.dots i.on{background:var(--ink);width:18px;border-radius:4px}
.dots i.nt{background:#d6c7e6}.dots i.nt.on{background:var(--ink)}
/* overlay */
.ov{position:fixed;inset:0;background:rgba(59,47,42,.4);display:none;align-items:flex-start;justify-content:center;padding:20px;z-index:10;overflow:auto}
.ov.show{display:flex}
.sheet{background:var(--paper);border-radius:24px;max-width:820px;width:100%;padding:20px;border:2px solid var(--line)}
.sheet h2{font-family:Jua,sans-serif;font-weight:400;margin:0 0 12px;font-size:24px;display:flex;align-items:center}
.sheet h2 button{margin-left:auto;font-size:28px;line-height:1;padding:0 6px}
.sheet h3{font-size:15px;color:var(--muted);margin:14px 0 8px;font-weight:700}
.toc{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:6px}
.toc button{text-align:left;padding:8px 10px;border-radius:12px;background:#fff;border:1.5px solid var(--line);font-size:15px}
.toc button b{font-family:Jua,sans-serif;font-weight:400;color:var(--muted);margin-right:4px}
.toc button.cur{border-color:var(--ink)}
.toc button .m{float:right;font-size:11px;color:#c0392b}
.drop{border:3px dashed #d9c6a8;border-radius:20px;padding:22px;text-align:center;background:#fff}
.drop.over{background:#fff4e2;border-color:var(--es)}
.btns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.btn{padding:10px 18px;border-radius:999px;background:var(--ink);color:#fff;font-size:15px}
.btn.alt{background:#fff;color:var(--ink);border:2px solid var(--line)}
.note{font-size:14px;color:var(--muted);line-height:1.6}
.stat{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px;justify-content:center}
.stat span{font-size:13px;padding:4px 10px;border-radius:999px;border:1.5px solid var(--line);background:#fff}
label.tg{display:flex;gap:8px;align-items:center;margin-top:12px;font-size:15px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(30px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:15px;opacity:0;transition:.25s;pointer-events:none;z-index:20;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%)}
input[type=file]{display:none}
.lang .lbl{white-space:nowrap;flex-wrap:nowrap}
@media(max-width:480px){.brand{font-size:18px}.chip{padding:7px 11px;font-size:14px}.app{padding:10px 10px 20px}.card{padding:16px 14px 18px;border-radius:22px}.lang{min-height:74px;padding:10px 12px}.lang .play{width:44px;height:44px}.num{width:52px;height:52px;font-size:22px}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <svg width="30" height="30" viewBox="0 0 32 32" aria-hidden="true"><path d="M4 7c4-2 8-2 12 1 4-3 8-3 12-1v18c-4-2-8-2-12 1-4-3-8-3-12-1z" fill="#fde3c8" stroke="#3b2f2a" stroke-width="2" stroke-linejoin="round"/><path d="M16 8v18" stroke="#3b2f2a" stroke-width="2"/></svg>
      성경 66권 듣기
    </div>
    <button class="chip" id="tocBtn">📖 목차</button>
    <button class="chip" id="audioBtn">🔊 <span id="audioStat">음성 불러오기</span></button>
  </header>

  <main class="card" id="card">
    <div class="top">
      <div class="num" id="num">01</div>
      <div><div class="title" id="title">창세기</div><div class="testament" id="testament"></div></div>
    </div>
    <div class="grid" id="grid"></div>
    <div class="bar">
      <button class="nav" id="prev" aria-label="이전 페이지"><svg width="26" height="26" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button class="all" id="allBtn"><span id="allIco">▶</span> <span id="allTxt">모두 듣기</span></button>
      <button class="nav" id="next" aria-label="다음 페이지"><svg width="26" height="26" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </div>
    <div class="dots" id="dots"></div>
  </main>
</div>

<div class="ov" id="tocOv"><div class="sheet">
  <h2>목차 <button data-close aria-label="닫기">×</button></h2>
  <h3>구약 39권</h3><div class="toc" id="tocOT"></div>
  <h3>신약 27권</h3><div class="toc" id="tocNT"></div>
</div></div>

<div class="ov" id="audOv"><div class="sheet">
  <h2>음성 파일 불러오기 <button data-close aria-label="닫기">×</button></h2>
  <div class="drop" id="drop">
    <div style="font-size:38px">🎧</div>
    <div style="font-family:Jua,sans-serif;font-size:20px;margin:6px 0">Azure에서 만든 음성 파일을 여기에 끌어다 놓으세요</div>
    <div class="note">파일 이름 예: <b>창세기-영어-0001.mp3</b> · <b>01_창세기_en.mp3</b><br>권 번호(1~66)와 언어 이름(영어·스페인어…) 또는 언어 코드(en·es·he·zh)로 자동으로 짝을 맞춥니다.</div>
    <div class="btns">
      <button class="btn" id="pickDir">폴더 선택</button>
      <button class="btn alt" id="pickFiles">파일 여러 개 선택</button>
    </div>
    <input type="file" id="inDir" webkitdirectory multiple>
    <input type="file" id="inFiles" multiple accept="audio/*,.mp3,.wav,.ogg,.m4a">
    <div class="stat" id="langStat"></div>
  </div>
  <label class="tg"><input type="checkbox" id="ttsFallback" checked> 음성 파일이 없는 단어는 기기 음성(TTS)으로 읽기</label>
  <label class="tg"><input type="checkbox" id="remember" checked> 이 브라우저에 음성 파일 기억하기 (다음에 다시 안 불러와도 됨)</label>
  <div class="btns" style="justify-content:flex-start"><button class="btn alt" id="clearAud">불러온 음성 지우기</button></div>
  <p class="note">키보드: ← → 페이지 넘기기 · 1~5 언어별 듣기 · 스페이스 모두 듣기</p>
</div></div>

<div class="toast" id="toast"></div>

        <span class="lbl">${L.name} <span style="font-weight:400;opacity:.7">${L.sub}</span>${has?'':'<span class="tag">'+(Object.keys(audioMap).length?'파일 없음 · TTS':'기기 음성')+'</span>'}</span>
        <div class="word" ${L.k==='he'?'dir="rtl" lang="he"':'lang="'+L.k+'"'}>${esc(b[L.k])}</div>
        ${showP?`<div class="pr">${esc(b[L.k+'_p'])}</div>`:''}
      </span></button>`;
  }).join('');
  $('prev').disabled = page===0; $('next').disabled = page===65;
  $('dots').innerHTML = BOOKS.map((_,i)=>`<i class="${i>=39?'nt':''}${i===page?' on':''}"></i>`).join('');
  markPlaying();
  try{ if(location.hash !== '#p'+(page+1)) history.replaceState(null,'','#p'+(page+1)); }catch(e){}
}
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function go(p){ if(p<0||p>65) return; stopAll(); page=p; render(); }

/* ---------- playback ---------- */
function markPlaying(){
  document.querySelectorAll('.lang').forEach(el=>{
    el.classList.toggle('playing', playingKey === BOOKS[page].n+'_'+el.dataset.l);
  });
  $('allBtn').classList.toggle('on', !!seq);
  $('allIco').textContent = seq ? '■' : '▶';
  $('allTxt').textContent = seq ? '멈추기' : '모두 듣기';
}
function play(lk){
  return new Promise(resolve=>{
    const b = BOOKS[page], key = b.n+'_'+lk, a = audioMap[key];
    stopSound();
    playingKey = key; markPlaying();
    const done = ()=>{ if(playingKey===key){ playingKey=null; markPlaying(); } resolve(); };
    if(a){
      player.src = a.url; player.onended = done; player.onerror = done;
      player.play().catch(()=>{ toast('재생할 수 없어요. 한 번 더 눌러 주세요.'); done(); });
    } else if($('ttsFallback').checked && 'speechSynthesis' in window){
      try{
        const u = new SpeechSynthesisUtterance(b[lk]);
        u.lang = b[lk+'_t']; u.rate = .85;
        const v = speechSynthesis.getVoices().find(v=>v.lang && v.lang.toLowerCase().startsWith(lk));
        if(v) u.voice = v; else if(lk==='he') toast('이 기기에는 히브리어 음성이 없을 수 있어요. 음성 파일을 불러오세요.');
        u.onend = done; u.onerror = done;
        speechSynthesis.speak(u);
      }catch(e){ done(); }
    } else { toast('이 단어의 음성 파일이 없어요'); done(); }
  });
}
function stopSound(){
  try{ player.pause(); player.onended=null; player.onerror=null; }catch(e){}
  try{ speechSynthesis.cancel(); }catch(e){}
  playingKey=null;
}
function stopAll(){ seq=null; stopSound(); markPlaying(); }
async function playAll(){
  if(seq){ stopAll(); return; }
  const token = seq = {};
  markPlaying();
  for(const L of LANGS){
    if(seq!==token) return;
    await play(L.k);
    if(seq!==token) return;
    await new Promise(r=>setTimeout(r,550));
  }
  if(seq===token){ seq=null; markPlaying(); }
}

/* ---------- audio loading ---------- */
const EXT = /\.(mp3|wav|ogg|m4a|aac|webm)$/i;
const codeRe = /(?:^|[_\-\s.])(ko|en|es|he|zh)(?:[_\-][a-z]{2})?\.(mp3|wav|ogg|m4a|aac|webm)$/i;
const LWORD = {'한국어':'ko','영어':'en','스페인어':'es','히브리어':'he','중국어':'zh','중국':'zh','북경어':'zh'};
const nameToBook = {}; BOOKS.forEach(b=>nameToBook[b.name]=b.n);
function keyFor(fname, forceLang){
  if(!EXT.test(fname)) return null;
  let lk = forceLang || null;
  if(!lk){ const m = fname.match(codeRe); if(m) lk = m[1].toLowerCase(); }
  if(!lk){ for(const w in LWORD){ if(fname.includes(w)){ lk = LWORD[w]; break; } } }
  if(!lk) return null;
  const base = fname.replace(EXT,'');
  let n = null;
  const tail = base.match(/(?:^|\D)(\d{1,4})$/);           // 끝 번호 우선 (예: 창세기-한국어-0012)
  const head = base.match(/^(\d{1,2})(?!\d)/);              // 앞 번호 (예: 12_느헤미야_ko)
  for(const m of [tail, head]){ if(m && +m[1]>=1 && +m[1]<=66){ n = String(+m[1]).padStart(2,'0'); break; } }
  if(!n){ for(const nm in nameToBook){ if(base.includes(nm)){ n=nameToBook[nm]; break; } } }
  return n ? n+'_'+lk : null;
}
async function addFiles(list, save=true){
  let added=0, skipped=[];
  for(const f of list){
    const k = keyFor(f.name);
    if(!k){ if(EXT.test(f.name)) skipped.push(f.name); continue; }
    if(audioMap[k] && !audioMap[k].embedded) URL.revokeObjectURL(audioMap[k].url);
    audioMap[k] = {blob:f, url:URL.createObjectURL(f), name:f.name};
    added++;
    if(save && $('remember').checked) dbPut(k, f, f.name);
  }
  updateStat(); render();
  let msg = `음성 ${added}개를 연결했어요`;
  if(skipped.length) msg += ` · 이름을 못 알아본 파일 ${skipped.length}개`;
  if(added||skipped.length) toast(msg);
  if(skipped.length) console.log('짝을 못 찾은 파일:', skipped);
}
function updateStat(){
  const total = Object.keys(audioMap).length;
  $('audioStat').textContent = total ? `음성 ${total}/330` : '음성 불러오기';
  $('audioBtn').classList.toggle('ok', total>0);
  $('langStat').innerHTML = LANGS.map(L=>{
    const c = BOOKS.filter(b=>audioMap[b.n+'_'+L.k]).length;
    return `<span style="border-color:var(--${L.k})">${L.k==='ko'?'한국어':L.sub} ${c}/66</span>`;
  }).join('');
  document.querySelectorAll('.toc button').forEach(btn=>{
    const n = BOOKS[+btn.dataset.p].n;
    const miss = total ? LANGS.filter(L=>!audioMap[n+'_'+L.k]).length : 0;
    btn.querySelector('.m').textContent = miss ? '−'+miss : '';
  });
}

/* IndexedDB (convenience only) */
let db=null;
function dbOpen(){ return new Promise(res=>{ try{ const r=indexedDB.open('bible66-audio',1);
  r.onupgradeneeded=()=>r.result.createObjectStore('a');
  r.onsuccess=()=>{db=r.result;res(db)}; r.onerror=()=>res(null);}catch(e){res(null)} }); }
function dbPut(k,blob,name){ try{ db && db.transaction('a','readwrite').objectStore('a').put({blob,name},k);}catch(e){} }
function dbClear(){ try{ db && db.transaction('a','readwrite').objectStore('a').clear(); }catch(e){} }
async function dbLoad(){
  await dbOpen(); if(!db) return;
  try{
    const st = db.transaction('a').objectStore('a'); const req = st.openCursor();
    req.onsuccess = ()=>{ const c=req.result; if(c){ const v=c.value; audioMap[c.key]={blob:v.blob,url:URL.createObjectURL(v.blob),name:v.name}; c.continue(); } else { updateStat(); render(); } };
  }catch(e){}
}

/* ---------- ui wiring ---------- */
let tt; function toast(t){ const el=$('toast'); el.textContent=t; el.classList.add('show'); clearTimeout(tt); tt=setTimeout(()=>el.classList.remove('show'),2600); }
function buildToc(){
  const mk = (i)=>`<button data-p="${i}"><b>${BOOKS[i].n}</b>${esc(BOOKS[i].name)}<span class="m"></span></button>`;
  $('tocOT').innerHTML = BOOKS.slice(0,39).map((_,i)=>mk(i)).join('');
  $('tocNT').innerHTML = BOOKS.slice(39).map((_,i)=>mk(i+39)).join('');
}
$('grid').addEventListener('click',e=>{ const el=e.target.closest('.lang'); if(!el) return; seq=null; play(el.dataset.l); });
$('prev').onclick=()=>go(page-1); $('next').onclick=()=>go(page+1);
$('allBtn').onclick=playAll;
$('tocBtn').onclick=()=>{ document.querySelectorAll('.toc button').forEach(b=>b.classList.toggle('cur',+b.dataset.p===page)); $('tocOv').classList.add('show'); };
$('audioBtn').onclick=()=>$('audOv').classList.add('show');
document.querySelectorAll('.ov').forEach(o=>o.addEventListener('click',e=>{ if(e.target===o||e.target.closest('[data-close]')) o.classList.remove('show'); }));
document.querySelectorAll('.toc').forEach(t=>t.addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b) return; go(+b.dataset.p); $('tocOv').classList.remove('show'); }));
$('pickDir').onclick=()=>$('inDir').click();
$('pickFiles').onclick=()=>$('inFiles').click();
$('inDir').onchange=e=>addFiles(e.target.files); $('inFiles').onchange=e=>addFiles(e.target.files);
$('ttsFallback').onchange=render;
$('clearAud').onclick=()=>{ for(const k in audioMap){ if(!audioMap[k].embedded) URL.revokeObjectURL(audioMap[k].url); delete audioMap[k]; } dbClear(); loadEmbedded(); updateStat(); render(); toast('불러온 음성을 지웠어요'); };
const drop=$('drop');
['dragenter','dragover'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('over')}));
['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove('over')}));
drop.addEventListener('drop',async e=>{
  const items=[...(e.dataTransfer.items||[])], files=[];
  const walk = (entry)=>new Promise(res=>{
    if(entry.isFile) entry.file(f=>{files.push(f);res()},()=>res());
    else if(entry.isDirectory){ const r=entry.createReader(); const all=[];
      const read=()=>r.readEntries(async ents=>{ if(!ents.length){ for(const x of all) await walk(x); res(); } else { all.push(...ents); read(); } },()=>res()); read(); }
    else res();
  });
  const entries = items.map(i=>i.webkitGetAsEntry && i.webkitGetAsEntry()).filter(Boolean);
  if(entries.length){ for(const en of entries) await walk(en); } else files.push(...e.dataTransfer.files);
  addFiles(files);
});
document.addEventListener('keydown',e=>{
  if(document.querySelector('.ov.show')){ if(e.key==='Escape') document.querySelectorAll('.ov').forEach(o=>o.classList.remove('show')); return; }
  if(e.key==='ArrowRight') go(page+1);
  else if(e.key==='ArrowLeft') go(page-1);
  else if(e.key===' '){ e.preventDefault(); playAll(); }
  else if(/^[1-5]$/.test(e.key)){ seq=null; play(LANGS[+e.key-1].k); }
});
let sx=null,sy=null;
$('card').addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
$('card').addEventListener('touchend',e=>{ if(sx==null) return; const dx=e.changedTouches[0].clientX-sx, dy=e.changedTouches[0].clientY-sy;
  if(Math.abs(dx)>60 && Math.abs(dx)>Math.abs(dy)*1.5) go(page+(dx<0?1:-1)); sx=null; });
function fromHash(){ const m=location.hash.match(/^#p(\d{1,2})$/); if(m){ const p=+m[1]-1; if(p>=0&&p<66&&p!==page){ stopAll(); page=p; render(); } } }
window.addEventListener('hashchange',fromHash);
try{ speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged=()=>{}; }catch(e){}

loadEmbedded(); buildToc(); fromHash(); render(); updateStat(); dbLoad();
</script>
</body>
</html>
